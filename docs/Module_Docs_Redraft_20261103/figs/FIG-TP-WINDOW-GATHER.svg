<text xml:space="preserve" x="190" y="528" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="13" font-weight="500" fill="#1d2530"><tspan dy="0.0">源地址 = 对象起点 + 表中前 t 项之和（[4146, 4655, 5175]）；目的地址在引擎内顺序累加；消费核 CCU 对三张表求和得每 token 总长</tspan></text>
<text xml:space="preserve" x="30" y="600" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="15" font-weight="600" fill="#b42318"><tspan dy="0.0">token 驻留时产出本来就按 token 连续，一个对象一张表、不需要聚集；备选：消费方按窗口分段算、部分和停放 L1，MAE 只顺序搬（数据流篇定）</tspan></text>
