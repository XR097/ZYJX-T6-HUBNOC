<text xml:space="preserve" x="30" y="30" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="20" font-weight="700" fill="#172b4d"><tspan dy="0.0">FIG-TP-WINDOW-GATHER  权重驻留：4 个 token × 3 个窗口的产出次序，每窗口一个对象 + 长度表，MAE 按表聚集 token 1</tspan></text>
<text xml:space="preserve" x="30" y="62" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="15" font-weight="500" fill="#1d2530"><tspan dy="0.0">产出次序 = 窗口 0 的 token 0…3，再窗口 1…；每个窗口的 4 片紧挨成一个对象（QNT 一个攒字寄存器），长度表 4 × 24 bit 另存；MAE 先读 3 张表，再逐片取</tspan></text>
