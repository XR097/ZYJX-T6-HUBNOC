<text x="757.0" y="405.0" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="13" font-weight="700" fill="#c2410c">分几级、放在哪【设计者定】（协议篇 A1–A7），本图为一种画法</text>
<rect x="750.0" y="420.5" width="441.2" height="23" rx="5" fill="#ffedd5" stroke="#c2410c" stroke-width="1.1"/>
<text x="757.0" y="432.0" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="13" font-weight="700" fill="#c2410c">几核共享带宽 = MAE_ENG 把连续的字轮流排给各核；单核吃满 32 B/拍</text>
<rect x="421.9" y="527.0" width="196.2" height="22" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.1"/>
<text x="428.9" y="538.0" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">32 B · 字地址 · be 32 · src</text>
<rect x="471.0" y="561.0" width="98.0" height="22" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.1"/>
<text x="478.0" y="572.0" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">每拍一个存储字</text>
<rect x="1107.4" y="309.0" width="184.6" height="22" rx="5" fill="#ffedd5" stroke="#c2410c" stroke-width="1.1"/>
<text x="1114.4" y="320.0" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="12" font-weight="700" fill="#c2410c">核集合 4 bit · 随每个存储字</text>
