<rect x="1204.4" y="946.0" width="107.6" height="22" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.1"/>
<text x="1211.4" y="957.0" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">核 3：1 × 32 B</text>
<text x="40.0" y="36.0" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="30" font-weight="700" fill="white">FIG-HUB_IDN-ARCH  HUB_IDN：一路 32 B 进，按每字的核集合分发，每核一条 32 B 链路</text>
<text x="40.0" y="66.0" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="500" fill="#cbd5e1">输入只有一路 32 B（MAE 的 IDN 出口，NI 分路 / MAE_DSU 已在 MAE 内择一）；核集合随每个存储字由 MAE_ENG 给；接几核即多播分叉点，各核独立取走；不拆拍、不缓存、不算地址</text>
<text x="314.0" y="216.0" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="700" fill="#172b4d">HUB 组 · 两篇（全芯片一组）</text>
<text x="495.0" y="262.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="700" fill="#98a2b3">HUB_NOC</text>
<text x="495.0" y="281.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="12" font-weight="500" fill="#98a2b3">本单元不用 · 中心端 L2 · 与 HUB_IDN 无数据连接</text>
<text x="660.0" y="124.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="700" fill="#98a2b3">中央 L2</text>
<text x="660.0" y="143.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="12" font-weight="500" fill="#98a2b3">本单元不用</text>
<text x="1010.0" y="124.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="700" fill="#98a2b3">命令网</text>
<text x="1010.0" y="143.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="12" font-weight="500" fill="#98a2b3">本单元不用</text>
<text x="1410.0" y="124.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="700" fill="#b45309">MAE_ENG（MAE 组）</text>
<text x="1410.0" y="143.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="12" font-weight="500" fill="#1d2530">核集合随字（旁带）· 收写入握手</text>
<text x="145.0" y="527.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="700" fill="#0369a1">NI_INT（MAE 组）</text>
<text x="145.0" y="546.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="12" font-weight="500" fill="#1d2530">IDN 出口：1 × 32 B</text>
<text x="145.0" y="563.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="12" font-weight="500" fill="#1d2530">NI 读返回分路 / MAE_DSU</text>
<text x="145.0" y="580.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="12" font-weight="500" fill="#1d2530">在 MAE 内择一</text>
<text x="145.0" y="727.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="700" fill="#98a2b3">MAE_DSU（MAE 组）</text>
<text x="145.0" y="746.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="12" font-weight="500" fill="#98a2b3">本单元不用 · 经 NI_INT 的 IDN 出口</text>
<text x="145.0" y="857.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="700" fill="#98a2b3">MAE_CRU（MAE 组）</text>
<text x="145.0" y="876.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="12" font-weight="500" fill="#98a2b3">本单元不用 · 只写 L2</text>
<text x="710.0" y="1002.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="700" fill="#98a2b3">四核 LDP / 发送桥</text>
<text x="710.0" y="1021.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="12" font-weight="500" fill="#98a2b3">本单元不用 · H2C / C2H 归 HUB_NOC</text>
<text x="1160.0" y="1002.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="700" fill="#334155">四核 IDN 接收桥（NWB）</text>
<text x="1160.0" y="1021.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="12" font-weight="500" fill="#1d2530">每核 1 条 32 B 链路 · 与 LDP 相同的接收桥</text>
<text x="754.0" y="341.0" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="700" fill="#334155">HUB_IDN（本单元）</text>
<text x="1135.0" y="532.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#0369a1">分叉点：按每字的核集合分发</text>
<text x="1135.0" y="552.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="13" font-weight="500" fill="#1d2530">一拍 = 一个存储字（din 32 B · addr · be · src）</text>
<text x="1135.0" y="570.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="13" font-weight="500" fill="#1d2530">核集合里的每个核各拉一路 en，各核独立取走</text>
<text x="1135.0" y="588.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="13" font-weight="500" fill="#1d2530">每目的核 1 位已取，全部取走才收下一拍</text>
<text x="1135.0" y="606.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="13" font-weight="500" fill="#1d2530">不另配存储 · 不拆拍 · 不算地址 · 不数单位</text>
<text x="80.0" y="996.5" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="13" font-weight="500" fill="#1d2530">数据：握手写流</text>
<text x="80.0" y="1023.5" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="13" font-weight="500" fill="#1d2530">控制旁带 / 写入握手</text>
<text x="316.0" y="996.5" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="13" font-weight="500" fill="#1d2530">灰框 = 本单元不用</text>
