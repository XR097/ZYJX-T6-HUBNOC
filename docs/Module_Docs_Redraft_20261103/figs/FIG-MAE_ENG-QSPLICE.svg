<text xml:space="preserve" x="30" y="534" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="15" font-weight="600" fill="#b42318"><tspan dy="0.0">读时合并只是地址几何；错开 bank 由编译链保证</tspan></text>
