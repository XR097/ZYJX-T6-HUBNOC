<text xml:space="preserve" x="60" y="360" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="600" fill="#b42318"><tspan dy="0.0">token 1 的记录 = 四个区域各一片：18 + 25 + 11 + 26 = 80 B，CCU 按四张表依次给四段地址，段解包器按 k 顺序接着解</tspan></text>
<text xml:space="preserve" x="60" y="386" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="13" font-weight="600" fill="#172b4d"><tspan dy="0.0">基址若取字 0 / 32 / 64 / 96（模 4 都是 0），四道首拍都落 bank 8、每拍只能写一项；错开后各道各自推进、偶发撞 bank 由入口 FIFO 吸收</tspan></text>
<text xml:space="preserve" x="60" y="408" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="13" font-weight="600" fill="#8a94a6"><tspan dy="0.0">实际每段 32 个输出通道、片长随 keep 变；四个象限的数据块各自独立、不同址（V18-MAE-33）</tspan></text>
</svg>
