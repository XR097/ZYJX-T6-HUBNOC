<text xml:space="preserve" x="50" y="302" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="500" fill="#1d2530"><tspan dy="0.0">→ 按 addr 写进段 SRAM 字 0–48（ready = 段 SRAM 有空位）</tspan></text>
<text xml:space="preserve" x="50" y="336" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="500" fill="#1d2530"><tspan dy="0.0">段计数器按块循环：成员 0、1、2 依次进"下一条"寄存器</tspan></text>
