<text xml:space="preserve" x="30" y="34" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" font-weight="700" fill="#172b4d"><tspan dy="0.0">FIG-TP-CTRL-MSG  一段 Fusion 按 addr 写进段 SRAM、成员逐条进"下一条"寄存器</tspan></text>
<text xml:space="preserve" x="30" y="74" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="500" fill="#1d2530"><tspan dy="0.0">命令网 64 bit/拍、每拍带 addr（端点内地址）；1,024 bit 指令 = 16 拍；段头字数归 ISA（图中 1 拍示意）；本段 49 拍，无末拍标记、无长度字段</tspan></text>
<path d="M30.0,112.0 L74.0,112.0" stroke="#172b4d" stroke-width="2.2" fill="none" marker-end="url(#ad)"/>
