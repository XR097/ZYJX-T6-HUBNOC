<text xml:space="preserve" x="30" y="616" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="700" fill="#b42318"><tspan dy="0.0">端点按 addr 写入、不按往来种类选目标；段 SRAM 无段选、不在数据网上</tspan></text>
