<text x="40.0" y="32.0" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="28" font-weight="700" fill="white">FIG-MXU-POD  一个 pod 的参考结构</text>
<text x="40.0" y="68.0" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" font-weight="500" fill="#cbd5e1">参考设计：供数（MXU_FEED）→ 阵列（MXU_ARR），pod 状态机（MXU_CONTROLLER）在一侧给控制</text>
<text x="54.0" y="207.0" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" font-weight="700" fill="#0f766e">MXU_FEED 供数</text>
<text x="54.0" y="707.0" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" font-weight="700" fill="#6d28d9">MXU_ARR 阵列</text>
<text x="240.0" y="135.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f766e">权重字 · 4 路 × 32 B</text>
<text x="610.0" y="135.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f766e">尺度字 · 至多 2 路</text>
<text x="980.0" y="135.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f766e">激活码 128 B + 旁带</text>
<text x="240.0" y="274.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="700" fill="#334155">权重缓冲</text>
<text x="240.0" y="302.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="500" fill="#1d2530">按槽存放 · 128 个槽 × 32 B</text>
<text x="240.0" y="414.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="700" fill="#0f766e">逐源压紧器</text>
<text x="240.0" y="442.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="500" fill="#1d2530">64 个单元 · 16 个候选取 8 个</text>
<text x="240.0" y="554.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="700" fill="#0f766e">阵列侧接线</text>
<text x="240.0" y="582.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="500" fill="#1d2530">按 pass 的模式切换</text>
<text x="610.0" y="274.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="700" fill="#334155">尺度寄存</text>
<text x="610.0" y="302.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="500" fill="#1d2530">保持在用的尺度字</text>
<text x="610.0" y="414.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="700" fill="#0f766e">指数差计算</text>
<text x="610.0" y="442.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="500" fill="#1d2530">取最大值 · 各做一次减法</text>
<text x="980.0" y="274.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="700" fill="#334155">激活缓冲</text>
<text x="980.0" y="302.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="500" fill="#1d2530">顺序进出 · 两个时间片</text>
<text x="980.0" y="414.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="700" fill="#0f766e">对齐移位</text>
<text x="980.0" y="442.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="500" fill="#1d2530">按元素位宽 w 切成元素</text>
<text x="980.0" y="554.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="700" fill="#0f766e">激活解码</text>
<text x="980.0" y="582.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="500" fill="#1d2530">有效数 · 符号 · 元素指数</text>
<text x="252.0" y="665.0" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f766e">权重数字</text>
<text x="622.0" y="665.0" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f766e">指数偏移 · 组指数</text>
<text x="992.0" y="665.0" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f766e">激活元素</text>
<text x="610.0" y="763.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="700" fill="#6d28d9">32 条数字道 × 16 条列道的乘法器</text>
<text x="610.0" y="791.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="500" fill="#1d2530">4 bit 权重数字 × 激活有效数 · 每拍 512 次</text>
<text x="610.0" y="873.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="700" fill="#6d28d9">分段归约树</text>
<text x="610.0" y="901.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="500" fill="#1d2530">每条列道一棵 · 同一个 MX 组先做整数和</text>
<text x="610.0" y="981.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="700" fill="#6d28d9">128 个 FP32 累加项</text>
<text x="610.0" y="1009.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="500" fill="#1d2530">每（源, 列道）一个 · 完成时舍入成 BF16</text>
<text x="610.0" y="1083.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="700" fill="#334155">AEB</text>
<text x="610.0" y="1111.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="500" fill="#1d2530">每个 pod 8 条 × 256 bit</text>
<text x="610.0" y="1216.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">AEB 出口（去 EPI）· 一条 = 16 个 BF16</text>
<text x="1380.0" y="1013.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">粗分数旁路（去 SEL）</text>
<text x="1430.0" y="560.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="700" fill="#b45309">pod 状态机</text>
<text x="1430.0" y="588.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="500" fill="#1d2530">MXU_CONTROLLER</text>
<text x="1430.0" y="612.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="500" fill="#1d2530">排槽 · 取数 · 释放</text>
<text x="1430.0" y="636.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="500" fill="#1d2530">累加项 · stall</text>
<text x="1368.0" y="135.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="700" fill="#c2410c">CCU 的配置、脉冲</text>
<text x="1510.0" y="135.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="700" fill="#b91c1c">stall_mxu</text>
<text x="1240.0" y="405.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="700" fill="#c2410c">供数控制</text>
<text x="1240.0" y="492.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="700" fill="#c2410c">供数状态</text>
<text x="1240.0" y="765.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="700" fill="#c2410c">阵列控制</text>
<text x="1240.0" y="852.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="700" fill="#c2410c">阵列状态</text>
