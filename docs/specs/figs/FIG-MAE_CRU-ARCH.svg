<text x="40.0" y="36.0" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="30" font-weight="700" fill="white">FIG-MAE_CRU-ARCH  MAE_CRU：从 L2 读四份、合并、写回 L2</text>
<text x="40.0" y="66.0" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="500" fill="#cbd5e1">输入 = NI 读口一拍读出的四个象限同址存储字（4 × 32 B，按象限掩码取份）；三种合并；输出 = 32 B 经 NI-L2C 写回 L2；由 MAE 收齐参与核的发出报告后启动；地址与停发由 MAE_ENG 控制</text>
