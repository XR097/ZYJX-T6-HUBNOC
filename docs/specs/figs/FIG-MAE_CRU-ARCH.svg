<text x="420.0" y="629.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="12" font-weight="500" fill="#1d2530">NI-L2C 返回车道</text>
<text x="420.0" y="646.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="12" font-weight="500" fill="#1d2530">（NI 读口 4 × 32 B）</text>
<text x="420.0" y="663.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="12" font-weight="500" fill="#1d2530"></text>
<text x="420.0" y="680.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="12" font-weight="500" fill="#1d2530">NI-L2C 写客户</text>
<text x="420.0" y="697.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="12" font-weight="500" fill="#1d2530">（NI 写口 32 B）</text>
<text x="970.0" y="476.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="700" fill="#0369a1">四份对齐（按象限掩码取份）</text>
<text x="970.0" y="495.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="12" font-weight="500" fill="#1d2530">一拍 4 × 32 B：四个象限的同一象限内地址各一份</text>
<text x="970.0" y="512.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="12" font-weight="500" fill="#1d2530">掩码外的象限不计入 · 份数 &gt; 4 时另读 L2 其他地址累加【设计者定】</text>
<text x="970.0" y="647.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="700" fill="#6d28d9">合并（三种形态，加法次序按象限固定）</text>
<text x="970.0" y="666.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="12" font-weight="500" fill="#1d2530">部分和归约：BF16 逐元素求和（标准加法树）</text>
