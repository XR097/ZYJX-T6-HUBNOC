<text x="40.0" y="32.0" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="28" font-weight="700" fill="white">FIG-MXU_ARR-DIGITS  一个 8 bit 权重码拆成两个 4 bit 数字，各乘一次</text>
<text x="40.0" y="68.0" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" font-weight="500" fill="#cbd5e1">例：c = 45 = 16 × 2 + 13，激活为 3　hi 道与 lo 道之和对全部权重码都等于 c</text>
<text x="175.0" y="324.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="700" fill="#334155">权重码 c = 45</text>
<text x="175.0" y="352.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="500" fill="#1d2530">= 16 × 2 + 13</text>
<text x="515.0" y="214.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="700" fill="#1d4ed8">高位数字 h = 2</text>
<text x="515.0" y="242.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="500" fill="#1d2530">hi 平面</text>
<text x="515.0" y="434.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="700" fill="#0f766e">低位数字 ℓ = 13</text>
<text x="515.0" y="462.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="500" fill="#1d2530">lo 平面</text>
<text x="880.0" y="214.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="700" fill="#1d4ed8">hi 道取 (2h + 1) × 8</text>
<text x="880.0" y="242.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="500" fill="#1d2530">= (2 × 2 + 1) × 8 = 40</text>
<text x="880.0" y="434.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="700" fill="#0f766e">lo 道取 ℓ − 8</text>
<text x="880.0" y="462.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="500" fill="#1d2530">= 13 − 8 = 5</text>
<text x="1215.0" y="214.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="700" fill="#1d4ed8">120</text>
<text x="1215.0" y="242.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="500" fill="#1d2530">= 40 × 3</text>
<text x="1215.0" y="434.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="700" fill="#0f766e">15</text>
<text x="1215.0" y="462.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="500" fill="#1d2530">= 5 × 3</text>
<text x="1470.0" y="324.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="700" fill="#6d28d9">和 = 135</text>
<text x="1470.0" y="352.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="500" fill="#1d2530">= 45 × 3</text>
<text x="1080.0" y="214.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="700" fill="#1d2530">× 3</text>
<text x="1080.0" y="434.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="700" fill="#1d2530">× 3</text>
<text x="880.0" y="340.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="700" fill="#b91c1c">两道之和 = 45</text>
<text x="845.0" y="602.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="700" fill="#475569">只读 hi 平面时读出 16h + 8 = 40</text>
<text x="845.0" y="630.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="500" fill="#1d2530">正好是区间 32–47 的中点</text>
<text x="1576" y="748" text-anchor="end" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="500" fill="#8a94a6">Owner: WangYizhao · 2026-11-11</text>
</svg>