<text xml:space="preserve" x="170" y="264" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="600" fill="#b42318"><tspan dy="0.0">2^e_m = 2^e_max / 2^Δ_m，无损</tspan></text>
<text xml:space="preserve" x="170" y="288" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="13" font-weight="600" fill="#172b4d"><tspan dy="0.0">实际每块 32 个输出通道；lo 块复用同块 hi 的 e_max 与 Δ_m；消费侧把 Δ_m 折进道级指数偏移</tspan></text>
