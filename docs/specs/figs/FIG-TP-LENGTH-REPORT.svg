<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
<defs><marker id="ad" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7Z" fill="#1d2530"/></marker><marker id="ar" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7Z" fill="#b42318"/></marker><marker id="ac" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7Z" fill="#2f5d8a"/></marker></defs><rect width="100%" height="100%" fill="white"/>
<text xml:space="preserve" x="30" y="34" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" font-weight="700" fill="#172b4d"><tspan dy="0.0">FIG-TP-LENGTH-REPORT  变长数据块：核 0 → L2 → 核 2 的七步</tspan></text>
<text xml:space="preserve" x="30" y="74" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="500" fill="#1d2530"><tspan dy="0.0">例：每 token 一个通道片，P = 768、w = 6；图中只画码块与元数据项（E8M0 项、F 列表另两块）</tspan></text>
<rect x="30" y="116" width="240" height="60" rx="2" fill="#fff0d2" stroke="#172b4d" stroke-width="1.5"/>
<text xml:space="preserve" x="150.0" y="146.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="600" fill="#1d2530"><tspan dy="0.0">编译链 / 指令</tspan></text>
<rect x="284" y="116" width="1286" height="60" rx="2" fill="white" stroke="#172b4d" stroke-width="1.5"/>
<text xml:space="preserve" x="300" y="146.0" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="500" fill="#1d2530"><tspan dy="0.0">1. 码块容量窗口 [0][A][字节 6400, 8128) = 576 B × 3 片；元数据项基址；L2 目的基址</tspan></text>
<rect x="30" y="190" width="240" height="60" rx="2" fill="#cfe8c6" stroke="#172b4d" stroke-width="1.5"/>
<text xml:space="preserve" x="150.0" y="220.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="600" fill="#1d2530"><tspan dy="0.0">核 0 QNT + CCU</tspan></text>
<rect x="284" y="190" width="1286" height="60" rx="2" fill="white" stroke="#172b4d" stroke-width="1.5"/>
<text xml:space="preserve" x="300" y="220.0" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="500" fill="#1d2530"><tspan dy="0.0">2. 3 片码 520 / 403 / 389 B，默认每片从字边界起：起点 0 / 544 / 960，共 43 字；每片一个元数据项，3 × 128 B = 12 字</tspan></text>
<path d="M150.0,176.0 L150.0,190.0" stroke="#1d2530" stroke-width="2.0" fill="none" marker-end="url(#ad)"/>
<rect x="30" y="264" width="240" height="60" rx="2" fill="#cfe8c6" stroke="#172b4d" stroke-width="1.5"/>
<text xml:space="preserve" x="150.0" y="294.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="600" fill="#1d2530"><tspan dy="0.0">核 0 CCU（C2H）</tspan></text>
<rect x="284" y="264" width="1286" height="60" rx="2" fill="white" stroke="#172b4d" stroke-width="1.5"/>
<text xml:space="preserve" x="300" y="294.0" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="500" fill="#1d2530"><tspan dy="0.0">3. 发码块 43 + 元数据项 12 = 55 拍（addr 由 CCU 给）；数满 55 个写入握手 = 已写进 L2</tspan></text>
<path d="M150.0,250.0 L150.0,264.0" stroke="#1d2530" stroke-width="2.0" fill="none" marker-end="url(#ad)"/>
<rect x="30" y="338" width="240" height="60" rx="2" fill="#cfe8c6" stroke="#172b4d" stroke-width="1.5"/>
<text xml:space="preserve" x="150.0" y="368.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="600" fill="#1d2530"><tspan dy="0.0">核 0 CCU</tspan></text>
<rect x="284" y="338" width="1286" height="60" rx="2" fill="white" stroke="#172b4d" stroke-width="1.5"/>
<text xml:space="preserve" x="300" y="368.0" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18"><tspan fill="#1d2530" font-weight="500">4. 经 </tspan><tspan fill="#2f5d8a" font-weight="700">发出报告信号组（hub，每核一组）</tspan><tspan fill="#1d2530" font-weight="500"> → MAE：只带目的起始地址 = 码块的容量窗口基址</tspan></text>
<path d="M150.0,324.0 L150.0,338.0" stroke="#1d2530" stroke-width="2.0" fill="none" marker-end="url(#ad)"/>
<rect x="30" y="412" width="240" height="60" rx="2" fill="#e4dcf3" stroke="#172b4d" stroke-width="1.5"/>
<text xml:space="preserve" x="150.0" y="442.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="600" fill="#1d2530"><tspan dy="0.0">MAE_ENG</tspan></text>
<rect x="284" y="412" width="1286" height="60" rx="2" fill="white" stroke="#172b4d" stroke-width="1.5"/>
<text xml:space="preserve" x="300" y="442.0" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="500" fill="#1d2530"><tspan dy="0.0">5. 按地址配上 L2 → 核 2 指令（合并送、只开象限 0、核集合 {核 2}）→ 由道 0 的道引擎执行</tspan></text>
<path d="M150.0,398.0 L150.0,412.0" stroke="#1d2530" stroke-width="2.0" fill="none" marker-end="url(#ad)"/>
<rect x="30" y="486" width="240" height="60" rx="2" fill="#e4dcf3" stroke="#172b4d" stroke-width="1.5"/>
<text xml:space="preserve" x="150.0" y="516.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="600" fill="#1d2530"><tspan dy="0.0">道 0 的道引擎</tspan></text>
<rect x="284" y="486" width="1286" height="60" rx="2" fill="white" stroke="#172b4d" stroke-width="1.5"/>
<text xml:space="preserve" x="300" y="516.0" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18"><tspan fill="#1d2530" font-weight="500">6. 先搬元数据项 12 字、由元数据项得出码块长度 43 字，再搬码块；数满 55 个写入握手 → 经 </tspan><tspan fill="#2f5d8a" font-weight="700">写完通知信号组（hub）</tspan><tspan fill="#1d2530" font-weight="500"> 给核 2</tspan></text>
<path d="M150.0,472.0 L150.0,486.0" stroke="#1d2530" stroke-width="2.0" fill="none" marker-end="url(#ad)"/>
<rect x="30" y="560" width="240" height="60" rx="2" fill="#f9e3a6" stroke="#172b4d" stroke-width="1.5"/>
<text xml:space="preserve" x="150.0" y="590.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="600" fill="#1d2530"><tspan dy="0.0">核 2 CCU</tspan></text>
<rect x="284" y="560" width="1286" height="60" rx="2" fill="white" stroke="#172b4d" stroke-width="1.5"/>
<text xml:space="preserve" x="300" y="590.0" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="500" fill="#1d2530"><tspan dy="0.0">7. 收写完通知：段选 + 码块的目的基址 + 写入字数 55（本图只计码块 + 元数据项）→ 读元数据项得起点 0 / 544 / 960</tspan></text>
<path d="M150.0,546.0 L150.0,560.0" stroke="#1d2530" stroke-width="2.0" fill="none" marker-end="url(#ad)"/>
<text xml:space="preserve" x="30" y="654" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18"><tspan fill="#1d2530" font-weight="500">第 6 步同时经 </tspan><tspan fill="#2f5d8a" font-weight="700">完成通知信号组</tspan><tspan fill="#1d2530" font-weight="500">（MAE → LIC）带指令标号通知 LIC；</tspan><tspan fill="#2f5d8a" font-weight="700">蓝字 = 专用信号组（valid + 载荷），不经命令网</tspan></text>
<text xml:space="preserve" x="30" y="688" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="700" fill="#b42318"><tspan dy="0.0">片尾补齐 · 握手数满再报 · 报告按地址对应指令 · 元数据项先搬 · 握手数满再发写完通知</tspan></text>
<text xml:space="preserve" x="1576" y="748" text-anchor="end" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="13" font-weight="500" fill="#8a94a6"><tspan dy="0.0">Owner: WangYizhao · 2026-11-11</tspan></text>
</svg>