<text x="40.0" y="32.0" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="28" font-weight="700" fill="white">FIG-MXU_FEED-LANE-OFFSET  尺度沿归约维不同时：每条数字道一个指数差</text>
<text x="40.0" y="68.0" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" font-weight="500" fill="#cbd5e1">缩小例：4 条数字道　公共指数取最大值，各道按 2 的（−指数差）次幂对齐后再求和</text>
<text x="325.0" y="156.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="700" fill="#1d2530">乘积</text>
<text x="535.0" y="156.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="700" fill="#1d2530">尺度指数 e</text>
<text x="790.0" y="156.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="700" fill="#1d2530">指数差 = 5 − e</text>
<text x="1085.0" y="156.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="700" fill="#1d2530">对齐后的乘积</text>
<text x="220.0" y="223.0" text-anchor="end" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="700" fill="#1d2530">数字道 0</text>
<text x="325.0" y="223.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="700" fill="#1d4ed8">6</text>
<text x="535.0" y="223.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="700" fill="#334155">3</text>
<text x="790.0" y="223.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="700" fill="#b45309">5 − 3 = 2</text>
<text x="1085.0" y="223.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">6 × 2^(−2) = 1.5</text>
<text x="220.0" y="323.0" text-anchor="end" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="700" fill="#1d2530">数字道 1</text>
<text x="325.0" y="323.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="700" fill="#1d4ed8">−3</text>
<text x="535.0" y="323.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="700" fill="#334155">5</text>
<text x="790.0" y="323.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="700" fill="#b45309">5 − 5 = 0</text>
<text x="1085.0" y="323.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">−3 × 2^(−0) = −3</text>
<text x="220.0" y="423.0" text-anchor="end" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="700" fill="#1d2530">数字道 2</text>
<text x="325.0" y="423.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="700" fill="#1d4ed8">8</text>
<text x="535.0" y="423.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="700" fill="#334155">2</text>
<text x="790.0" y="423.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="700" fill="#b45309">5 − 2 = 3</text>
<text x="1085.0" y="423.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">8 × 2^(−3) = 1</text>
<text x="220.0" y="523.0" text-anchor="end" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="700" fill="#1d2530">数字道 3</text>
<text x="325.0" y="523.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="700" fill="#1d4ed8">5</text>
<text x="535.0" y="523.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="700" fill="#334155">5</text>
<text x="790.0" y="523.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="700" fill="#b45309">5 − 5 = 0</text>
<text x="1085.0" y="523.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">5 × 2^(−0) = 5</text>
<text x="1430.0" y="342.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="700" fill="#6d28d9">和 = 4.5</text>
<text x="1430.0" y="372.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="500" fill="#1d2530">× 2^5</text>
<text x="1430.0" y="399.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="500" fill="#1d2530">= 144</text>
<text x="730.0" y="653.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="700" fill="#334155">直接算：6 × 2^3 − 3 × 2^5 + 8 × 2^2 + 5 × 2^5 = 144</text>
<text x="1240.0" y="653.0" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="700" fill="#b91c1c">两种算法都得 144</text>
<text x="1576" y="748" text-anchor="end" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="500" fill="#8a94a6">Owner: WangYizhao · 2026-11-11</text>
</svg>