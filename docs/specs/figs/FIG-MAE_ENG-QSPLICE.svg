<text xml:space="preserve" x="30" y="416" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="500" fill="#1d2530"><tspan dy="0.0">反例：区域基址 [0, 32, 64, 96] 模 4 相同，四道每拍落同一 bank，A 类写集合口每拍只能写一项、落地降到 32 B/拍</tspan></text>
<text xml:space="preserve" x="30" y="442" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="500" fill="#1d2530"><tspan dy="0.0">之后各道各自推进（片长不同、进度不同），偶发撞 bank 由 LDP 入口 FIFO 吸收；MAE_CRU 的定长份仍同址异象限、四道源地址相同只差象限选</tspan></text>
<text xml:space="preserve" x="30" y="482" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="15" font-weight="600" fill="#b42318"><tspan dy="0.0">四道各走各的对象与长度表，互不耦合；区域基址错开 bank 由编译链保证</tspan></text>
