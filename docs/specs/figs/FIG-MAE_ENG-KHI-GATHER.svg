<rect x="50" y="210" width="260" height="50" rx="2" fill="#d3e3f6" stroke="#172b4d" stroke-width="1.2"/>
<text xml:space="preserve" x="180.0" y="235.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="600" fill="#1d2530"><tspan dy="0.0">key 7：B + 7×64 = B + 448</tspan></text>
