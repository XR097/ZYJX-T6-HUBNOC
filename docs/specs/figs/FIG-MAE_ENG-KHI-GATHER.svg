<text xml:space="preserve" x="50" y="320" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="500" fill="#1d2530"><tspan dy="0.0">K hi 已驻留在核 L1（粗算落地区），精算时 hi、lo 两条列道各取一处</tspan></text>
<text xml:space="preserve" x="50" y="350" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="500" fill="#1d2530"><tspan dy="0.0">目的：核 L1 lo 区，按 key 连续，共 128 B</tspan></text>
