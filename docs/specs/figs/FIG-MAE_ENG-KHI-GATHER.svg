<text xml:space="preserve" x="1270.0" y="212.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="600" fill="#1d2530"><tspan dy="0.0">全码记录 64–127：lo 4 个存储字</tspan></text>
<rect x="780" y="250" width="220" height="44" rx="2" fill="#f8d3c9" stroke="#172b4d" stroke-width="1.2"/>
