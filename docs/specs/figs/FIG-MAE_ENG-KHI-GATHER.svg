<text xml:space="preserve" x="50" y="110" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="15" font-weight="500" fill="#1d2530"><tspan dy="0.0">项字节数 64 B，每项 1 段</tspan></text>
<rect x="50" y="140" width="260" height="50" rx="2" fill="#d3e3f6" stroke="#172b4d" stroke-width="1.2"/>
