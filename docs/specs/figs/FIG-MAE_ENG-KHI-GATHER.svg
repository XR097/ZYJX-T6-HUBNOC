<text xml:space="preserve" x="780" y="400" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="500" fill="#1d2530"><tspan dy="0.0">每 key 一条 128 B 记录，平面分开；E8M0 尺度另段落 S 类</tspan></text>
