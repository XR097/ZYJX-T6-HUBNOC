<text xml:space="preserve" x="780" y="110" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="15" font-weight="500" fill="#1d2530"><tspan dy="0.0">项字节数 128 B，每项 2 段（两处不连续，展开方式【设计者定】）</tspan></text>
