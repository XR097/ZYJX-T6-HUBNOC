<text xml:space="preserve" x="210" y="242" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="15" font-weight="500" fill="#1d2530"><tspan dy="0.0">：指令 0 并集 11010010、指令 1 并集 00100101；灰格是同址上别的对象。掩码写为象限 3→0</tspan></text>
<text xml:space="preserve" x="30" y="276" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="15" font-weight="500" fill="#1d2530"><tspan dy="0.0">参与核不同的两组用两条指令、两个地址；两条指令可先后执行，ping-pong 由编译链在 L2 地址里安排</tspan></text>
