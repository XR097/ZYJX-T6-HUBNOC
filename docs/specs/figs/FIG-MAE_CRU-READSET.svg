<text xml:space="preserve" x="30" y="34" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#172b4d"><tspan dy="0.0">读集合并：指令 0（掩码 0111，共享前缀段）与指令 1（掩码 0101，某行私有段）各读一拍四个象限，按位取并</tspan></text>
<text xml:space="preserve" x="30" y="66" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei,Arial,sans-serif" font-size="15" font-weight="500" fill="#1d2530"><tspan dy="0.0">1 位 = 一个 key（或区块、列）要不要读；图中 8 bit，实际一个存储字 256 bit，更长的读集占连续几个字；结果写回 L2，由 MAE 当列表读用</tspan></text>
